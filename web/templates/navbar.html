<!-- Header -->
<header class="rc-header" id="rc-header">
    <div class="rc-header-content">
        <div class="rc-header-left">
            <!-- Desktop: Collapse/Expand toggle -->
            <button class="rc-sidebar-toggle desktop-only" id="sidebarToggle" aria-label="Toggle sidebar">
                <i class="bi bi-chevron-left" id="sidebarToggleIcon"></i>
            </button>

            <!-- Mobile: Hamburger menu -->
            <button class="rc-sidebar-toggle mobile-only" id="mobileSidebarToggle" aria-label="Toggle menu">
                <i class="bi bi-list"></i>
            </button>

            <h1 class="rc-header-brand">
                <img src="/static/images/logos/rentalcore_white_side.svg" alt="RentalCore" class="rc-header-logo" />
            </h1>
        </div>
    </div>
</header>

<!-- Mobile Backdrop -->
<div class="rc-sidebar-backdrop" id="sidebarBackdrop"></div>

<!-- Sidebar -->
<aside class="rc-sidebar" id="rcSidebar">
    <!-- Sidebar Header (Mobile only) -->
    <div class="rc-sidebar-header mobile-only">
        <h2 class="rc-sidebar-brand">
            <img src="/static/images/logos/rentalcore_white_side.svg" alt="RentalCore" class="rc-sidebar-logo" />
        </h2>
        <button class="rc-sidebar-close" id="mobileSidebarClose" aria-label="Close menu">
            <i class="bi bi-x"></i>
        </button>
    </div>

    <nav class="rc-sidebar-nav">
        <!-- Cross-navigation to WarehouseCore -->
        <a href="" id="storage-nav-link" class="rc-nav-item rc-nav-crosslink" title="Switch to WarehouseCore">
            <i class="bi bi-box-seam"></i>
            <span class="rc-nav-label">WarehouseCore</span>
        </a>
        <script>
        (function() {
            var link = document.getElementById('storage-nav-link');
            var storageDomain = '{{.WarehouseCoreDomain}}';
            var protocol = window.location.protocol;

            var targetUrl;
            if (storageDomain && storageDomain !== '') {
                targetUrl = protocol + '//' + storageDomain;
            } else {
                var hostname = window.location.hostname;
                var port = window.location.port;

                if (hostname.startsWith('rent.') || hostname.startsWith('rental.')) {
                    var warehouseHost = hostname.replace(/^rent(al)?\./, 'warehouse.');
                    targetUrl = protocol + '//' + warehouseHost;
                } else if (port === '8081') {
                    targetUrl = protocol + '//' + hostname + ':8082';
                } else if (port === '') {
                    targetUrl = protocol + '//' + hostname;
                } else {
                    targetUrl = protocol + '//' + hostname + ':8082';
                }
            }

            link.href = targetUrl;
        })();
        </script>

        <!-- Main navigation items -->
        <a href="/" class="rc-nav-item {{if eq .currentPage "home"}}active{{end}}" title="Dashboard">
            <i class="bi bi-house-door"></i>
            <span class="rc-nav-label">Dashboard</span>
        </a>

        <a href="/jobs" class="rc-nav-item {{if eq .currentPage "jobs"}}active{{end}}" title="Jobs">
            <i class="bi bi-briefcase"></i>
            <span class="rc-nav-label">Jobs</span>
        </a>

        <a href="/customers" class="rc-nav-item {{if eq .currentPage "customers"}}active{{end}}" title="Customers">
            <i class="bi bi-people"></i>
            <span class="rc-nav-label">Customers</span>
        </a>


        <!-- Tools Dropdown -->
        <div class="rc-nav-dropdown">
            <button class="rc-nav-dropdown-toggle {{if or (eq .currentPage "analytics") (eq .currentPage "financial") (eq .currentPage "documents_pool") (eq .currentPage "mappings")}}active{{end}}" data-dropdown="tools">
                <i class="bi bi-tools"></i>
                <span class="rc-nav-label">Tools</span>
                <i class="bi bi-chevron-down rc-dropdown-icon"></i>
            </button>
            <div class="rc-nav-dropdown-menu" id="dropdown-tools">
                <a href="/analytics" class="rc-nav-dropdown-item {{if eq .currentPage "analytics"}}active{{end}}">
                    <i class="bi bi-graph-up"></i>
                    <span class="rc-nav-label">Analytics</span>
                </a>
                <a href="/financial" class="rc-nav-dropdown-item {{if eq .currentPage "financial"}}active{{end}}">
                    <i class="bi bi-calculator"></i>
                    <span class="rc-nav-label">Financial</span>
                </a>
                <a href="/documents/pool" class="rc-nav-dropdown-item {{if eq .currentPage "documents_pool"}}active{{end}}">
                    <i class="bi bi-folder2-open"></i>
                    <span class="rc-nav-label">File Pool</span>
                </a>
                <a href="/settings/mappings" class="rc-nav-dropdown-item {{if eq .currentPage "mappings"}}active{{end}}">
                    <i class="bi bi-database-gear"></i>
                    <span class="rc-nav-label">Produkt-Mappings</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- User Profile & Logout -->
    <div class="rc-sidebar-footer">
        {{if .user}}
        <!-- User Dropdown Trigger -->
        <div class="rc-user-dropdown">
            <button class="rc-user-profile-btn" id="userDropdownToggle" aria-label="User menu">
                <i class="bi bi-person-circle"></i>
                <span class="rc-nav-label rc-user-name">{{.user.Username}}</span>
                <i class="bi bi-chevron-up rc-user-dropdown-icon"></i>
            </button>

            <!-- User Dropdown Menu -->
            <div class="rc-user-dropdown-menu" id="userDropdownMenu">
                <a href="/settings/company" class="rc-user-dropdown-item {{if eq .currentPage "settings"}}active{{end}}">
                    <i class="bi bi-building-gear"></i>
                    <span class="rc-nav-label">Company Settings</span>
                </a>
                <a href="/settings/mappings" class="rc-user-dropdown-item {{if eq .currentPage "mappings"}}active{{end}}">
                    <i class="bi bi-database-gear"></i>
                    <span class="rc-nav-label">Produkt-Mappings</span>
                </a>
                {{if hasAnyRole .user "admin" "manager"}}
                <a href="/users" class="rc-user-dropdown-item {{if eq .currentPage "users"}}active{{end}}">
                    <i class="bi bi-people-fill"></i>
                    <span class="rc-nav-label">User Management</span>
                </a>
                {{end}}
                {{if hasRole .user "admin"}}
                <a href="/security/roles" class="rc-user-dropdown-item {{if eq .currentPage "security"}}active{{end}}">
                    <i class="bi bi-shield-check"></i>
                    <span class="rc-nav-label">Security & Audit</span>
                </a>
                {{end}}
                <div class="rc-user-dropdown-divider"></div>
                <a href="/logout" class="rc-user-dropdown-item rc-logout-item">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="rc-nav-label">Logout</span>
                </a>
            </div>
        </div>

        <!-- Collapsed icon-only view -->
        <div class="rc-user-icon-only">
            <i class="bi bi-person-circle"></i>
        </div>
        {{else}}
        <a href="/login" class="rc-login-btn" title="Login">
            <i class="bi bi-box-arrow-in-right"></i>
            <span class="rc-nav-label">Login</span>
        </a>
        {{end}}
    </div>
</aside>

<!-- Sidebar Toggle Script -->
<script>
(function() {
    // Elements
    const sidebar = document.getElementById('rcSidebar');
    const header = document.getElementById('rc-header');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const mobileSidebarToggle = document.getElementById('mobileSidebarToggle');
    const mobileSidebarClose = document.getElementById('mobileSidebarClose');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    const sidebarToggleIcon = document.getElementById('sidebarToggleIcon');

    // Check if mobile
    function isMobile() {
        return window.innerWidth < 768;
    }

    // Load sidebar state from localStorage
    let sidebarOpen = localStorage.getItem('rc-sidebar-open');
    if (sidebarOpen === null) {
        sidebarOpen = !isMobile();
    } else {
        sidebarOpen = sidebarOpen === 'true';
    }

    // Apply initial state
    function applySidebarState() {
        if (isMobile()) {
            sidebar.classList.remove('open', 'collapsed');
            sidebarBackdrop.classList.remove('show');
            // Remove desktop body classes on mobile
            document.body.classList.remove('sidebar-open', 'sidebar-collapsed');
        } else {
            if (sidebarOpen) {
                sidebar.classList.add('open');
                sidebar.classList.remove('collapsed');
                document.body.classList.add('sidebar-open');
                document.body.classList.remove('sidebar-collapsed');
                if (sidebarToggleIcon) {
                    sidebarToggleIcon.classList.remove('bi-chevron-right');
                    sidebarToggleIcon.classList.add('bi-chevron-left');
                }
            } else {
                sidebar.classList.add('collapsed');
                sidebar.classList.remove('open');
                document.body.classList.add('sidebar-collapsed');
                document.body.classList.remove('sidebar-open');
                if (sidebarToggleIcon) {
                    sidebarToggleIcon.classList.remove('bi-chevron-left');
                    sidebarToggleIcon.classList.add('bi-chevron-right');
                }
            }
        }
    }

    applySidebarState();

    // Desktop toggle
    if (sidebarToggle) {
        sidebarToggle.addEventListener('click', function() {
            sidebarOpen = !sidebarOpen;
            localStorage.setItem('rc-sidebar-open', sidebarOpen);
            applySidebarState();
        });
    }

    // Mobile toggle (open)
    if (mobileSidebarToggle) {
        mobileSidebarToggle.addEventListener('click', function() {
            sidebar.classList.add('open');
            sidebarBackdrop.classList.add('show');
        });
    }

    // Mobile close button
    if (mobileSidebarClose) {
        mobileSidebarClose.addEventListener('click', function() {
            sidebar.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
        });
    }

    // Mobile backdrop click
    if (sidebarBackdrop) {
        sidebarBackdrop.addEventListener('click', function() {
            sidebar.classList.remove('open');
            sidebarBackdrop.classList.remove('show');
        });
    }

    // Close mobile sidebar on navigation
    const navItems = sidebar.querySelectorAll('.rc-nav-item, .rc-nav-dropdown-item');
    navItems.forEach(item => {
        item.addEventListener('click', function() {
            if (isMobile()) {
                sidebar.classList.remove('open');
                sidebarBackdrop.classList.remove('show');
            }
        });
    });

    // Handle window resize
    window.addEventListener('resize', function() {
        applySidebarState();
    });

    // Dropdown toggle functionality
    const dropdownToggles = document.querySelectorAll('.rc-nav-dropdown-toggle');

    dropdownToggles.forEach(toggle => {
        toggle.addEventListener('click', function(e) {
            e.preventDefault();
            const dropdownId = 'dropdown-' + this.dataset.dropdown;
            const menu = document.getElementById(dropdownId);
            const icon = this.querySelector('.rc-dropdown-icon');

            // Toggle this dropdown
            const isOpen = menu.classList.contains('open');

            if (isOpen) {
                menu.classList.remove('open');
                icon.classList.remove('bi-chevron-up');
                icon.classList.add('bi-chevron-down');
            } else {
                menu.classList.add('open');
                icon.classList.remove('bi-chevron-down');
                icon.classList.add('bi-chevron-up');

                // Auto-scroll to show dropdown items after animation
                setTimeout(() => {
                    const sidebarNav = document.querySelector('.rc-sidebar-nav');

                    if (sidebarNav && menu) {
                        // Find the last dropdown item
                        const dropdownItems = menu.querySelectorAll('.rc-nav-dropdown-item');
                        const lastItem = dropdownItems[dropdownItems.length - 1];

                        if (lastItem) {
                            // Get positions
                            const lastItemRect = lastItem.getBoundingClientRect();
                            const navRect = sidebarNav.getBoundingClientRect();

                            // Check if last item is below the visible area
                            if (lastItemRect.bottom > navRect.bottom) {
                                // Scroll to show the last dropdown item completely
                                lastItem.scrollIntoView({
                                    behavior: 'smooth',
                                    block: 'end',
                                    inline: 'nearest'
                                });
                            }
                        }
                    }
                }, 150); // Delay to allow CSS transition to complete
            }
        });
    });

    // Auto-open dropdown if current page is inside
    dropdownToggles.forEach(toggle => {
        if (toggle.classList.contains('active')) {
            const dropdownId = 'dropdown-' + toggle.dataset.dropdown;
            const menu = document.getElementById(dropdownId);
            const icon = toggle.querySelector('.rc-dropdown-icon');

            menu.classList.add('open');
            icon.classList.remove('bi-chevron-down');
            icon.classList.add('bi-chevron-up');
        }
    });

    // User dropdown toggle functionality
    const userDropdownToggle = document.getElementById('userDropdownToggle');
    const userDropdownMenu = document.getElementById('userDropdownMenu');

    if (userDropdownToggle && userDropdownMenu) {
        userDropdownToggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();

            const isOpen = userDropdownMenu.classList.contains('open');
            const icon = this.querySelector('.rc-user-dropdown-icon');

            if (isOpen) {
                userDropdownMenu.classList.remove('open');
                icon.classList.remove('bi-chevron-down');
                icon.classList.add('bi-chevron-up');
            } else {
                userDropdownMenu.classList.add('open');
                icon.classList.remove('bi-chevron-up');
                icon.classList.add('bi-chevron-down');
            }
        });

        // Close user dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!userDropdownToggle.contains(e.target) && !userDropdownMenu.contains(e.target)) {
                userDropdownMenu.classList.remove('open');
                const icon = userDropdownToggle.querySelector('.rc-user-dropdown-icon');
                if (icon) {
                    icon.classList.remove('bi-chevron-down');
                    icon.classList.add('bi-chevron-up');
                }
            }
        });
    }
})();
</script>
